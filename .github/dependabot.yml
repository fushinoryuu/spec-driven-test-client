version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request per week for routine dev tooling updates.
      # Major updates are not grouped, so each one gets its own pull request.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint supports TypeScript below 6.1.0. Remove this once it supports 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # The types follow the Node major pinned in .nvmrc. Change them together.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
